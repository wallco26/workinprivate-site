<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDF2FA"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Left accent bar -->
  <rect x="0" y="0" width="14" height="630" fill="#4B8BD4"/>

  <!-- Privacy badge -->
  <g transform="translate(80,86)">
    <rect x="0" y="0" width="330" height="52" rx="26" fill="#F0FFF4" stroke="#C6F6D5" stroke-width="2"/>
    <g transform="translate(26,14)" stroke="#38A169" stroke-width="2.5" fill="none">
      <rect x="0" y="9" width="24" height="15" rx="3"/>
      <path d="M5 9 V5 a7 7 0 0 1 14 0 V9"/>
    </g>
    <text x="66" y="34" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#38A169">100% PRIVATE &#183; RUNS ON YOUR PC</text>
  </g>

  <!-- Headline -->
  <text x="80" y="250" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="700" fill="#1B3A5C">Private AI that never</text>
  <text x="80" y="336" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="700" fill="#4B8BD4">leaves your computer.</text>

  <!-- Subhead -->
  <text x="80" y="410" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#5A6474">A ChatGPT-style assistant that runs on your own machine.</text>
  <text x="80" y="452" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#5A6474">No cloud. No account. Nothing used to train AI.</text>

