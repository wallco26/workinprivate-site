  </g>
  <text x="1120" y="574" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#8A9AB5">workinprivate.com</text>

  <!-- One-time price chip -->
  <g transform="translate(846,86)">
    <rect x="0" y="0" width="274" height="52" rx="26" fill="#EDF2FA" stroke="#D4E3F5" stroke-width="2"/>
    <text x="137" y="34" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#2E6BB5">$29.99 once &#183; no subscription</text>
